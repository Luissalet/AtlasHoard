[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-hoard"
version = "0.1.0"
description = "A local workspace for research cases: sources, entities and evidence-backed relations, with a timeline, a map and competing-hypotheses analysis, exposed to assistants through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
icon = ["pillow>=11", "numpy>=2"]

[project.scripts]
atlas-hoard = "atlas_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["atlas_hoard*"]

[tool.setuptools.package-data]
atlas_hoard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
